name: Build PS2 Native Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Extract Zip Source (If present)
        run: |
          if [ -f "CyberonicPS2.zip" ]; then
            unzip -o CyberonicPS2.zip
          fi

      - name: Build Native Shared Libraries (.so)
        run: |
          # Find directory containing Application.mk
          APP_MK_PATH=$(find . -type f -name "Application.mk" | head -n 1)
          
          if [ -n "$APP_MK_PATH" ]; then
            BUILD_DIR=$(dirname "$APP_MK_PATH")
            echo "Building in directory: $BUILD_DIR"
            
            # Run ndk-build with explicit project path pointing to the source directory
            $ANDROID_NDK_HOME/ndk-build \
              NDK_PROJECT_PATH="$BUILD_DIR" \
              NDK_APPLICATION_MK="$APP_MK_PATH" \
              APP_PLATFORM=android-21 \
              -j$(nproc)
          else
            echo "Application.mk not found in repository"
            exit 1
          fi

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-core-so-libraries
          path: '**/libs/**/*.so'
          
