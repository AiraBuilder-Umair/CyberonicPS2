name: Build PS2 Native Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Extract Zip Source (If present)
        run: |
          if [ -f "CyberonicPS2.zip" ]; then
            unzip -o CyberonicPS2.zip
          fi

      - name: Build Native Shared Libraries (.so)
        run: |
          # Target the exact CodeGen / Native JIT directory directly
          TARGET_DIR="CyberonicPS2/Play--CodeGen-master/build_android"
          
          if [ ! -d "$TARGET_DIR" ]; then
            # Fallback search if path differs slightly
            TARGET_DIR=$(find . -maxdepth 3 -type d -name "build_android" | head -n 1)
          fi

          if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            $ANDROID_NDK_HOME/ndk-build NDK_APPLICATION_MK=Application.mk APP_PLATFORM=android-21 -j$(nproc)
          else
            echo "Target build_android directory not found"
            exit 1
          fi

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-core-so-libraries
          path: '**/libs/**/*.so'
          
