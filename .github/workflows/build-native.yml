name: Build PS2 Native Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Extract Zip Source
        run: |
          if [ -f "CyberonicPS2.zip" ]; then
            unzip -o CyberonicPS2.zip
          fi

      - name: Build Native Shared Libraries (.so)
        run: |
          MK_PATH=$(find . -type f -name "Android.mk" | head -n 1)
          if [ -n "$MK_PATH" ]; then
            JNI_DIR=$(cd "$(dirname "$MK_PATH")" && pwd)
            cd "$JNI_DIR/.."
            $ANDROID_NDK_HOME/ndk-build APP_BUILD_SCRIPT="$JNI_DIR/Android.mk" NDK_PROJECT_PATH=. APP_PLATFORM=android-21
          else
            echo "Android.mk not found in repository"
            exit 1
          fi

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-libraries
          path: '**/libs/**/*.so'
          
      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-libraries
          path: '**/libs/**/*.so'
          
