name: Build PS2 Native Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Extract Zip Source
        run: |
          if [ -f "CyberonicPS2.zip" ]; then
            unzip -o CyberonicPS2.zip
          fi

      - name: Build Native Shared Libraries (.so)
        run: |
          MK_PATH=$(find . -name "Android.mk" | head -n 1)
          if [ -n "$MK_PATH" ]; then
            DIR_PATH=$(dirname "$MK_PATH")
            cd "$DIR_PATH"
            $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=.
          else
            echo "Android.mk not found in repository"
            exit 1
          fi

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-libraries
          path: '**/libs/**/*.so'
          
