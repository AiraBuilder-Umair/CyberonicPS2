name: Build PS2 Native Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Extract Zip Source (If present)
        run: |
          if [ -f "CyberonicPS2.zip" ]; then
            unzip -o CyberonicPS2.zip
          fi

      - name: Build Native Shared Libraries (.so)
        run: |
          # Find the exact file paths directly
          ANDROID_MK=$(find . -type f -name "Android.mk" | head -n 1)
          
          if [ -n "$ANDROID_MK" ]; then
            JNI_DIR=$(dirname "$ANDROID_MK")
            echo "Navigating to exact JNI directory: $JNI_DIR"
            cd "$JNI_DIR"
            
            # NDK_PROJECT_PATH=null forces NDK to ignore the default 'jni' folder rule
            # APP_BUILD_SCRIPT explicitly points to the correct Android.mk file
            $ANDROID_NDK_HOME/ndk-build \
              NDK_PROJECT_PATH=null \
              APP_BUILD_SCRIPT=Android.mk \
              NDK_APPLICATION_MK=Application.mk \
              APP_PLATFORM=android-21 \
              -j$(nproc)
          else
            echo "Error: Android.mk not found in repository."
            exit 1
          fi

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-core-so-libraries
          path: '**/libs/**/*.so'
          
