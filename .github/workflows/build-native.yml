name: Build PS2 Native Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract Zip Source
        run: |
          if [ -f "CyberonicPS2.zip" ]; then
            unzip -o CyberonicPS2.zip
          fi

      - name: Build Native Shared Libraries (.so)
        run: |
          if [ -d "build_android" ]; then
            cd build_android
            $ANDROID_NDK_LATEST_HOME/ndk-build APP_BUILD_SCRIPT=Android.mk NDK_PROJECT_PATH=.
          else
            echo "build_android folder not found"
          fi

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: arm64-v8a-libraries
          path: '**/libs/arm64-v8a/*.so'
